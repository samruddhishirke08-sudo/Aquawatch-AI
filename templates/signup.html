<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSense AI | Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

    <main class="login-container">
        <section class="login-brand">
            <div class="brand-icon">🌱</div>
            <h1>AquaSense <span>AI</span></h1>
            <p>Smarter Water. Better Farming.</p>
            <div class="login-illustration">💧</div>
            <h2>Start Smart Farming</h2>
            <p>Manage water efficiently and grow sustainably.</p>
        </section>

        <section class="login-form">
            <p class="eyebrow">JOIN AQUASENSE</p>
            <h2>Create Account</h2>
            <p class="form-description">Set up your farmer account.</p>

            <form action="{{ url_for('dashboard') }}" method="GET">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Create Password</label>
                <input type="password" id="password" placeholder="Create a password" required>

                <button type="submit" class="login-button">Create Account →</button>
            </form>

            <p class="signup-text">
                Already have an account?
                <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </section>
    </main>

</body>
</html>
