<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSense AI | Farmer Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

    <main class="login-container">
        <section class="login-brand">
            <div class="brand-icon">🌱</div>
            <h1>AquaSense <span>AI</span></h1>
            <p>Smarter Water. Better Farming.</p>
            <div class="login-illustration">💧</div>
            <h2>Grow More. Waste Less.</h2>
            <p>Intelligent agricultural water management.</p>
        </section>

        <section class="login-form">
            <p class="eyebrow">WELCOME BACK</p>
            <h2>Farmer Login</h2>
            <p class="form-description">Sign in to manage your farm irrigation.</p>

            <form action="{{ url_for('dashboard') }}" method="GET">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox"> Remember me
                    </label>
                    <span>Demo Account</span>
                </div>

                <button type="submit" class="login-button">Sign In →</button>
            </form>

            <p class="signup-text">
                New to AquaSense?
                <a href="{{ url_for('signup') }}">Create an account</a>
            </p>
        </section>
    </main>

</body>
</html>
